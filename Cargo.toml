[workspace]
resolver = "2"
members = ["crates/ct-agentd", "crates/ct-runs", "crates/ct-core", "crates/ct-store", "crates/ct-agent", "crates/ct-app"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
grep-matcher = "0.1"
nucleo-matcher = "0.3"
rayon = "1"
similar = "2"
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
postcard = { version = "1", features = ["use-std"] }
zstd = "0.13"
crc32fast = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
fs2 = "0.4"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.31"
tempfile = "3"
parking_lot = "0.12"
regex = "1"

[profile.release]
lto = "thin"
codegen-units = 4
opt-level = 3
