name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    # ubuntu-22.04 (glibc 2.35): the binary then runs on every distro at least that new
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches the crate version
        run: |
          v=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="ct-app"))')
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != version v$v"; exit 1; }
      - name: Tests
        run: |
          git config --global user.name ci && git config --global user.email ci@example.invalid
          cargo test --workspace --locked
      - name: Build tarball, .deb and SHA256SUMS
        run: dist/build.sh
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" --clobber dist/out/*.tar.gz dist/out/*.deb dist/out/SHA256SUMS
          else
            gh release create "${GITHUB_REF_NAME}" --title "CodeTrail ${GITHUB_REF_NAME}" --generate-notes \
              dist/out/*.tar.gz dist/out/*.deb dist/out/SHA256SUMS
          fi
